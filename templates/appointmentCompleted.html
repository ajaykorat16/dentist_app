<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointment Completed</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            /* color: #333; */
            line-height: 1.6;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        .header {
            background: #4CAF50;
            color: #fff;
            text-align: center;
            padding: 20px;
        }
        .header h1 {
            margin: 0;
        }
        .content {
            padding: 20px;
        }
        .content p {
            margin: 10px 0;
        }
        .footer {
            text-align: center;
            padding: 10px;
            font-size: 14px;
            color: #777;
            background: #f1f1f1;
        }
        .footer a {
            color: #4CAF50;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Appointment Completed</h1>
        </div>
        <div class="content">
            <p>Dear {{patient_name}},</p>
            <p>Your appointment at <strong>{{clinic_name}}</strong> on {{appointment_date}} at {{appointment_time}} has been successfully completed.</p>
            <p><strong>Prescription:</strong></p>
            <p>{{prescription}}</p>
        </div>
        <div class="footer">
            <p>&copy; {{current_year}} {{clinic_name}}. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
